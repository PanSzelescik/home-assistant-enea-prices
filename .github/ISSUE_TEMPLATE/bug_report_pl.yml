name: Zgłoszenie błędu (PL)
description: Zgłoś problem z integracją Enea Ceny
labels: ["bug", "lang: pl"]
body:
  - type: markdown
    attributes:
      value: |
        Dziękujemy za zgłoszenie! Przed wypełnieniem sprawdź czy podobny issue już istnieje.

  - type: input
    id: ha_version
    attributes:
      label: Wersja Home Assistant
      placeholder: "np. 2026.3.2"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Wersja integracji Enea Ceny
      placeholder: "np. 0.6.0"
    validations:
      required: true

  - type: input
    id: tariff
    attributes:
      label: Grupa taryfowa
      placeholder: "np. G11, G12, G12w, C11"
    validations:
      required: true

  - type: dropdown
    id: uses_other
    attributes:
      label: Czy używasz integracji Enea Licznik?
      options:
        - Tak
        - Nie
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Opis problemu
      description: Co się dzieje? Czego się spodziewałeś?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logi Home Assistant
      description: |
        Skopiuj logi z domeny `enea_prices` (Ustawienia → System → Logi, filtruj po "enea_prices").
      render: text
