name: Bug Report (EN)
description: Report a problem with the Enea Ceny integration
labels: ["bug", "lang: en"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check if a similar issue already exists before submitting.

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      placeholder: "e.g. 2026.3.2"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Enea Ceny Version
      placeholder: "e.g. 0.7.0"
    validations:
      required: true

  - type: input
    id: tariff
    attributes:
      label: Tariff Group
      placeholder: "e.g. G11, G12, G12w, C11"
    validations:
      required: true

  - type: dropdown
    id: uses_other
    attributes:
      label: Do you use the Enea Licznik integration?
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What is happening? What did you expect?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Home Assistant Logs
      description: |
        Paste logs from the `enea_prices` domain (Settings → System → Logs, filter by "enea_prices").
      render: text
