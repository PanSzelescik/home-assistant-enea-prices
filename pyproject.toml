[project]
name = "home-assistant-enea-prices"
version = "0.1.0"
requires-python = ">=3.14.2,<3.15"

[dependency-groups]
dev = [
    "homeassistant>=2026.3.3",
    # Mirrors the manifest requirement; tariffs.py imports it for Polish holidays.
    "holidays==0.98",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
